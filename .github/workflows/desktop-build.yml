name: Desktop Build / NativePHP Electron

on:
  push:
    tags:
      - 'v*'

jobs:
  build-desktop:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, bcmath, curl, zip

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          composer install -q --no-interaction --prefer-dist
          npm install
          npm run build

      - name: Verify NativePHP Environment
        run: php artisan native:install --force || true
