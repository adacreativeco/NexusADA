version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexusada_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: nexusada
      DB_USERNAME: nexususer
      DB_PASSWORD: secretpassword
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    depends_on:
      - db
      - redis
    networks:
      - nexus_network

  web:
    image: nginx:alpine
    container_name: nexusada_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - nexus_network

  db:
    image: mysql:8.4
    container_name: nexusada_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nexusada
      MYSQL_USER: nexususer
      MYSQL_PASSWORD: secretpassword
      MYSQL_ROOT_PASSWORD: rootsecretpassword
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - nexus_network

  redis:
    image: redis:alpine
    container_name: nexusada_redis
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - nexus_network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexusada_worker
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3
    depends_on:
      - app
      - redis
    networks:
      - nexus_network

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexusada_reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    depends_on:
      - app
    networks:
      - nexus_network

volumes:
  dbdata:
  redisdata:

networks:
  nexus_network:
    driver: bridge
